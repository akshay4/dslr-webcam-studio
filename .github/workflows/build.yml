# Builds and self-tests the apps on every push. Pushing a tag like v1.0.0 publishes a GitHub
# Release with the Windows app (one .exe), the macOS preview (.zip) and their SHA-256 checksums,
# using the matching section of CHANGELOG.md as release notes. Linux is work in progress: it is
# built and tested here to keep the code healthy, but not attached to releases yet.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $v" }
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1
      - name: Self-test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process windows/bin/DSLRWebcamStudio.exe -ArgumentList '--selftest', $dir -Wait -PassThru
          Get-Content (Join-Path $dir 'selftest.txt')
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Virtual camera test
        shell: pwsh
        run: |
          # Exercises the media source through Windows' IMFSourceReader (needs Media Foundation).
          if (Test-Path "$env:WINDIR\System32\mfplat.dll") {
            Push-Location windows/bin; ./test_vcam.exe ./DSLRWebcamStudioVCam.dll; $code = $LASTEXITCODE; Pop-Location
            if ($code -ne 0) { exit 1 }
          } else { "Media Foundation not installed on this runner; skipped." }
      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory dist | Out-Null
          $name = "DSLR_Webcam_Studio-$v-Windows-x64.exe"
          Copy-Item windows/bin/DSLRWebcamStudio.exe "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # Preview: unsigned (ad-hoc), so the virtual camera is unavailable in release builds.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" || { echo "Tag does not match VERSION"; exit 1; }
      - name: Build, self-test and package
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/build/*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libusb-1.0-0-dev
      - name: Build and self-test
        run: make -C linux test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - name: Checksums
        # LF line endings so "sha256sum -c SHA256SUMS.txt" works everywhere
        run: cd dist && sha256sum DSLR_Webcam_Studio-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Download
          **Windows 10/11 (64-bit):** download `DSLR_Webcam_Studio-*-Windows-x64.exe` below and run it. It's a
          single file with nothing to install. The virtual webcam needs Windows 11: click **Install virtual camera**
          in the app once.

          **macOS 12+ (preview, Apple silicon and Intel):** download `DSLR_Webcam_Studio-*-macOS.zip`, unzip it
          and move the app to Applications. It isn't notarized: the first time, open it, then click **Open Anyway**
          in System Settings → Privacy & Security. Not yet tested with a camera, so please send a Diagnostics
          report. The virtual webcam isn't available in this build (it needs an Apple Developer ID signature).

          `SHA256SUMS.txt` lets you verify the downloads. Linux is in progress and will be released later.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "DSLR Webcam Studio $GITHUB_REF_NAME" --notes-file notes.md --latest
