# Builds and self-tests all three apps on every push. Pushing a tag like v1.0.0 also publishes
# a GitHub Release with the Windows .exe, macOS .zip and Linux .AppImage attached, using the
# matching section of CHANGELOG.md as release notes.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1
      - name: Self-test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process windows/bin/DSLRWebcamStudio.exe -ArgumentList '--selftest', $dir -Wait -PassThru
          Get-Content (Join-Path $dir 'selftest.txt')
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item windows/bin/DSLRWebcamStudio.exe "dist/DSLR_Webcam_Studio-$v-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build, self-test and package
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/build/*.zip

  linux:
    runs-on: ubuntu-22.04   # older glibc = AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libusb-1.0-0-dev librsvg2-dev file libfuse2
      - name: Build, self-test and package
        run: bash linux/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: linux/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "DSLR Webcam Studio $GITHUB_REF_NAME" --notes-file notes.md
